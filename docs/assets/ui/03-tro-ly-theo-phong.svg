<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="title desc" lang="vi">
  <title id="title">Smart Home Future, màn 3: Trợ lý theo phòng (wireframe mục tiêu)</title>
  <desc id="desc">Người dùng đang xem Phòng khách và gõ Chuẩn bị xem phim. Trợ lý dùng Phòng khách làm ngữ cảnh, đưa kế hoạch ba bước: giảm đèn trần xuống 20 phần trăm, đóng rèm, đặt điều hòa 26 độ, kèm nút Chạy và Sửa. Ba thiết bị được viền xanh trên hình. Sau khi chạy, kết quả 2 trên 3: đèn và rèm đã xác minh, điều hòa không xác minh được nên hình vẫn hiện 28 độ. Trợ lý nói rõ đây là bước cuối, không còn bước nào chưa chạy, và đề nghị Thử lại.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2937; }
      .logo { font-size: 19px; font-weight: 700; fill: #1d4ed8; }
      .nav { font-size: 15px; fill: #374151; }
      .navon { font-size: 15px; font-weight: 700; fill: #1d4ed8; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 18px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 600; }
      .t { font-size: 15px; }
      .sub { font-size: 13px; fill: #6b7280; }
      .sm { font-size: 12px; fill: #6b7280; }
      .btn { font-size: 14px; font-weight: 600; fill: #1d4ed8; }
      .btnw { font-size: 14px; font-weight: 600; fill: #ffffff; }
      .pill { font-size: 12px; font-weight: 700; }
      .num { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Khung trang -->
  <rect width="1280" height="800" fill="#f3f4f6"/>
  <rect width="1280" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#e5e7eb"/>
  <rect x="24" y="16" width="24" height="24" rx="6" fill="#1d4ed8"/>
  <path d="M29 30 L36 23 L43 30 V36 H29 Z" fill="#ffffff"/>
  <text x="58" y="34" class="logo">Smart Home Future</text>
  <text x="260" y="34" class="navon">Cả nhà</text>
  <line x1="260" y1="44" x2="308" y2="44" stroke="#1d4ed8" stroke-width="3"/>
  <text x="340" y="34" class="nav">Sở thích</text>
  <rect x="1040" y="12" width="120" height="32" rx="16" fill="#1d4ed8"/>
  <text x="1100" y="33" text-anchor="middle" class="btnw">Trợ lý</text>
  <circle cx="1210" cy="28" r="16" fill="#e0e7ff"/>
  <text x="1210" y="32" text-anchor="middle" class="pill" style="fill:#3730a3">Bạn</text>

  <text x="40" y="86" class="btn">← Cả nhà</text>
  <text x="40" y="120" class="h1">Phòng khách</text>
  <rect x="196" y="102" width="132" height="24" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="262" y="119" text-anchor="middle" class="pill" style="fill:#854d0e">Thiết kế mục tiêu</text>

  <!-- Hình phòng sau khi chạy -->
  <rect x="40" y="144" width="640" height="616" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <g transform="translate(60,170) scale(0.8)">
    <rect x="0" y="0" width="740" height="380" fill="#f5f0e8"/>
    <rect x="0" y="380" width="740" height="196" fill="#e7dccb"/>
    <line x1="0" y1="380" x2="740" y2="380" stroke="#d6c8b0" stroke-width="2"/>
    <rect x="50" y="26" width="150" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <line x1="64" y1="58" x2="186" y2="58" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="64" y1="64" x2="186" y2="64" stroke="#cbd5e1" stroke-width="2"/>
    <text x="186" y="48" text-anchor="end" class="sm">28°</text>
    <!-- đèn đã giảm -->
    <circle cx="240" cy="70" r="40" fill="#fef3c7" fill-opacity="0.6"/>
    <line x1="240" y1="0" x2="240" y2="40" stroke="#6b7280" stroke-width="2"/>
    <path d="M210 66 L270 66 L258 40 L222 40 Z" fill="#fde68a" stroke="#b45309"/>
    <!-- rèm đã đóng -->
    <line x1="476" y1="36" x2="704" y2="36" stroke="#6b7280" stroke-width="4"/>
    <rect x="500" y="46" width="180" height="200" fill="#dbeafe" stroke="#94a3b8" stroke-width="4"/>
    <rect x="480" y="36" width="112" height="236" fill="#a5b4fc"/>
    <rect x="588" y="36" width="112" height="236" fill="#a5b4fc"/>
    <line x1="590" y1="36" x2="590" y2="272" stroke="#818cf8" stroke-width="2"/>
    <rect x="190" y="326" width="260" height="54" fill="#d6d3d1"/>
    <rect x="230" y="208" width="180" height="108" rx="4" fill="#374151"/>
    <rect x="310" y="316" width="20" height="10" fill="#374151"/>
    <rect x="110" y="432" width="400" height="44" rx="14" fill="#a3b0c2"/>
    <rect x="120" y="462" width="380" height="86" rx="18" fill="#94a3b8"/>
    <rect x="100" y="450" width="36" height="98" rx="12" fill="#8695aa"/>
    <rect x="484" y="450" width="36" height="98" rx="12" fill="#8695aa"/>
  </g>

  <!-- Viền xanh: thiết bị trong kế hoạch -->
  <rect x="90" y="184" width="136" height="50" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="3"/>
  <rect x="218" y="192" width="68" height="52" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="3"/>
  <rect x="436" y="190" width="194" height="204" rx="8" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="3"/>

  <circle cx="302" cy="218" r="13" fill="#1d4ed8"/>
  <text x="302" y="223" text-anchor="middle" class="num" style="fill:#ffffff">1</text>
  <rect x="320" y="205" width="104" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
  <text x="332" y="223" class="pill" style="fill:#166534">✓ Đèn · 20%</text>

  <circle cx="533" cy="412" r="13" fill="#1d4ed8"/>
  <text x="533" y="417" text-anchor="middle" class="num" style="fill:#ffffff">2</text>
  <rect x="551" y="399" width="112" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
  <text x="563" y="417" class="pill" style="fill:#166534">✓ Rèm · Đóng</text>

  <circle cx="104" cy="262" r="13" fill="#1d4ed8"/>
  <text x="104" y="267" text-anchor="middle" class="num" style="fill:#ffffff">3</text>
  <rect x="122" y="250" width="194" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
  <text x="134" y="268" class="pill" style="fill:#991b1b">! Điều hòa · vẫn 28°, chưa rõ</text>

  <rect x="60" y="664" width="22" height="14" rx="3" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="676" class="sub" style="fill:#374151">Thiết bị trong kế hoạch</text>
  <text x="60" y="704" class="sm">Hình chỉ đổi khi thiết bị xác nhận. Điều hòa giữ 28°,</text>
  <text x="60" y="722" class="sm">giá trị đã xác minh gần nhất.</text>

  <!-- Trợ lý -->
  <rect x="704" y="144" width="536" height="616" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="728" y="180" class="h2">Trợ lý</text>
  <rect x="796" y="162" width="176" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="884" y="180" text-anchor="middle" class="pill" style="fill:#1d4ed8">Ngữ cảnh: Phòng khách</text>

  <rect x="1052" y="200" width="164" height="38" rx="14" fill="#1d4ed8"/>
  <text x="1134" y="224" text-anchor="middle" class="t" style="fill:#ffffff">Chuẩn bị xem phim</text>

  <!-- Kế hoạch -->
  <rect x="728" y="252" width="488" height="148" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="744" y="280" class="name">Kế hoạch · Phòng khách</text>
  <circle cx="754" cy="306" r="10" fill="#1d4ed8"/>
  <text x="754" y="311" text-anchor="middle" class="num" style="fill:#ffffff">1</text>
  <text x="772" y="311" class="t">Giảm đèn trần xuống 20%</text>
  <circle cx="754" cy="334" r="10" fill="#1d4ed8"/>
  <text x="754" y="339" text-anchor="middle" class="num" style="fill:#ffffff">2</text>
  <text x="772" y="339" class="t">Đóng rèm</text>
  <circle cx="754" cy="362" r="10" fill="#1d4ed8"/>
  <text x="754" y="367" text-anchor="middle" class="num" style="fill:#ffffff">3</text>
  <text x="772" y="367" class="t">Đặt điều hòa 26°C</text>
  <text x="744" y="390" class="sm">Chưa thiết bị nào thay đổi trước khi bạn bấm Chạy.</text>
  <rect x="1112" y="266" width="88" height="32" rx="8" fill="#1d4ed8"/>
  <text x="1156" y="287" text-anchor="middle" class="btnw">Chạy</text>
  <rect x="1112" y="306" width="88" height="32" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1156" y="327" text-anchor="middle" class="btn">Sửa</text>

  <text x="972" y="424" text-anchor="middle" class="sm">Bạn đã bấm Chạy</text>

  <!-- Kết quả -->
  <rect x="728" y="436" width="488" height="150" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="744" y="464" class="name">Kết quả · 2/3 bước đã xác minh</text>
  <text x="744" y="498" class="t">1  Đèn trần 20%</text>
  <rect x="1096" y="482" width="104" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1106" y="498" class="pill" style="fill:#166534">✓ Đã xác minh</text>
  <text x="744" y="530" class="t">2  Rèm đóng</text>
  <rect x="1096" y="514" width="104" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1106" y="530" class="pill" style="fill:#166534">✓ Đã xác minh</text>
  <text x="744" y="562" class="t">3  Điều hòa 26°C</text>
  <rect x="1048" y="546" width="152" height="22" rx="11" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1058" y="562" class="pill" style="fill:#991b1b">! Không xác minh được</text>

  <rect x="728" y="600" width="488" height="64" rx="14" fill="#f3f4f6"/>
  <text x="744" y="626" class="t">Điều hòa chưa xác nhận 26°C, nên hình vẫn hiện 28°.</text>
  <text x="744" y="650" class="t">Đây là bước cuối, không còn bước nào chưa chạy.</text>

  <rect x="728" y="678" width="150" height="34" rx="8" fill="#1d4ed8"/>
  <text x="803" y="700" text-anchor="middle" class="btnw">Thử lại điều hòa</text>
  <rect x="888" y="678" width="90" height="34" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="933" y="700" text-anchor="middle" class="btn" style="fill:#374151">Để vậy</text>
  <text x="728" y="740" class="sm">Ở trang Cả nhà, câu khớp nhiều phòng sẽ được hỏi lại trước (xem màn 1).</text>

  <text x="1256" y="788" text-anchor="end" class="sm">Wireframe · thiết kế mục tiêu, chưa triển khai · 3/4</text>
</svg>
