<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="title desc" lang="vi">
  <title id="title">Smart Home Future, màn 2: Phòng khách (wireframe mục tiêu)</title>
  <desc id="desc">Hình minh họa phòng khách có đèn trần, rèm cửa sổ và điều hòa, mỗi thiết bị có điểm bấm đánh số. Đèn Đã xác minh, bật 80 phần trăm. Rèm Đang chờ lệnh đóng, hình vẫn vẽ rèm mở. Điều hòa Không xác minh được, hình giữ 28 độ là giá trị đã xác minh gần nhất. Bảng bên phải có nút điều khiển cho từng thiết bị và chú giải ba nhãn trạng thái. Có đường quay lại Cả nhà.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2937; }
      .logo { font-size: 19px; font-weight: 700; fill: #1d4ed8; }
      .nav { font-size: 15px; fill: #374151; }
      .navon { font-size: 15px; font-weight: 700; fill: #1d4ed8; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 18px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 600; }
      .t { font-size: 15px; }
      .sub { font-size: 13px; fill: #6b7280; }
      .sm { font-size: 12px; fill: #6b7280; }
      .btn { font-size: 14px; font-weight: 600; fill: #1d4ed8; }
      .btnw { font-size: 14px; font-weight: 600; fill: #ffffff; }
      .pill { font-size: 12px; font-weight: 700; }
      .num { font-size: 13px; font-weight: 700; }
      .sec { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Khung trang -->
  <rect width="1280" height="800" fill="#f3f4f6"/>
  <rect width="1280" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#e5e7eb"/>
  <rect x="24" y="16" width="24" height="24" rx="6" fill="#1d4ed8"/>
  <path d="M29 30 L36 23 L43 30 V36 H29 Z" fill="#ffffff"/>
  <text x="58" y="34" class="logo">Smart Home Future</text>
  <text x="260" y="34" class="navon">Cả nhà</text>
  <line x1="260" y1="44" x2="308" y2="44" stroke="#1d4ed8" stroke-width="3"/>
  <text x="340" y="34" class="nav">Sở thích</text>
  <rect x="1040" y="12" width="120" height="32" rx="16" fill="#1d4ed8"/>
  <text x="1100" y="33" text-anchor="middle" class="btnw">Trợ lý</text>
  <circle cx="1210" cy="28" r="16" fill="#e0e7ff"/>
  <text x="1210" y="32" text-anchor="middle" class="pill" style="fill:#3730a3">Bạn</text>

  <text x="40" y="86" class="btn">← Cả nhà</text>
  <text x="40" y="120" class="h1">Phòng khách</text>
  <rect x="196" y="102" width="132" height="24" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="262" y="119" text-anchor="middle" class="pill" style="fill:#854d0e">Thiết kế mục tiêu</text>

  <!-- Hình phòng -->
  <rect x="40" y="144" width="780" height="616" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <g transform="translate(60,164)">
    <rect x="0" y="0" width="740" height="380" fill="#f5f0e8"/>
    <rect x="0" y="380" width="740" height="196" fill="#e7dccb"/>
    <line x1="0" y1="380" x2="740" y2="380" stroke="#d6c8b0" stroke-width="2"/>
    <!-- điều hòa -->
    <rect x="50" y="26" width="150" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <line x1="64" y1="58" x2="186" y2="58" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="64" y1="64" x2="186" y2="64" stroke="#cbd5e1" stroke-width="2"/>
    <text x="186" y="48" text-anchor="end" class="sm">28°</text>
    <!-- đèn trần: bật -->
    <circle cx="240" cy="70" r="64" fill="#fef3c7" fill-opacity="0.9"/>
    <line x1="240" y1="0" x2="240" y2="40" stroke="#6b7280" stroke-width="2"/>
    <path d="M210 66 L270 66 L258 40 L222 40 Z" fill="#fcd34d" stroke="#b45309"/>
    <!-- cửa sổ và rèm: đang mở -->
    <line x1="476" y1="36" x2="704" y2="36" stroke="#6b7280" stroke-width="4"/>
    <rect x="500" y="46" width="180" height="200" fill="#dbeafe" stroke="#94a3b8" stroke-width="4"/>
    <line x1="590" y1="46" x2="590" y2="246" stroke="#94a3b8" stroke-width="3"/>
    <line x1="500" y1="146" x2="680" y2="146" stroke="#94a3b8" stroke-width="3"/>
    <rect x="480" y="36" width="34" height="236" fill="#a5b4fc"/>
    <rect x="666" y="36" width="34" height="236" fill="#a5b4fc"/>
    <!-- TV và kệ -->
    <rect x="190" y="326" width="260" height="54" fill="#d6d3d1"/>
    <rect x="230" y="208" width="180" height="108" rx="4" fill="#374151"/>
    <rect x="310" y="316" width="20" height="10" fill="#374151"/>
    <!-- sofa -->
    <rect x="110" y="432" width="400" height="44" rx="14" fill="#a3b0c2"/>
    <rect x="120" y="462" width="380" height="86" rx="18" fill="#94a3b8"/>
    <rect x="100" y="450" width="36" height="98" rx="12" fill="#8695aa"/>
    <rect x="484" y="450" width="36" height="98" rx="12" fill="#8695aa"/>
  </g>

  <!-- Điểm bấm: 1 đèn, đã xác minh -->
  <circle cx="350" cy="244" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="350" y="249" text-anchor="middle" class="num">1</text>
  <rect x="372" y="230" width="134" height="28" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="384" y="249" class="pill" style="fill:#166534">✓ Đèn · Bật 80%</text>

  <!-- Điểm bấm: 2 rèm, đang chờ -->
  <circle cx="650" cy="426" r="14" fill="#ffffff" stroke="#d97706" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="650" y="431" text-anchor="middle" class="num">2</text>
  <rect x="566" y="448" width="176" height="28" rx="14" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5 3"/>
  <text x="578" y="467" class="pill" style="fill:#92400e">… Rèm · Đang chờ đóng</text>

  <!-- Điểm bấm: 3 điều hòa, không xác minh được -->
  <circle cx="185" cy="254" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="185" y="259" text-anchor="middle" class="num">3</text>
  <rect x="80" y="276" width="238" height="28" rx="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="92" y="295" class="pill" style="fill:#991b1b">! Điều hòa · Không xác minh được</text>

  <!-- Bảng thiết bị -->
  <rect x="844" y="144" width="396" height="616" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="868" y="180" class="h2">Thiết bị</text>
  <text x="868" y="202" class="sub">Bấm điểm trên hình hoặc dùng nút ở đây</text>

  <!-- 1 Đèn -->
  <rect x="868" y="220" width="348" height="124" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="892" cy="244" r="11" fill="#1d4ed8"/>
  <text x="892" y="249" text-anchor="middle" class="num" style="fill:#ffffff">1</text>
  <text x="912" y="250" class="name">Đèn trần</text>
  <rect x="1100" y="233" width="104" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1110" y="249" class="pill" style="fill:#166534">✓ Đã xác minh</text>
  <text x="884" y="282" class="t">Bật · độ sáng 80%</text>
  <rect x="884" y="300" width="44" height="24" rx="12" fill="#1d4ed8"/>
  <circle cx="916" cy="312" r="9" fill="#ffffff"/>
  <line x1="946" y1="312" x2="1150" y2="312" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
  <line x1="946" y1="312" x2="1109" y2="312" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1109" cy="312" r="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1204" y="317" text-anchor="end" class="sub">80%</text>

  <!-- 2 Rèm -->
  <rect x="868" y="356" width="348" height="124" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="892" cy="380" r="11" fill="#1d4ed8"/>
  <text x="892" y="385" text-anchor="middle" class="num" style="fill:#ffffff">2</text>
  <text x="912" y="386" class="name">Rèm</text>
  <rect x="1116" y="369" width="88" height="22" rx="11" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5 3"/>
  <text x="1126" y="385" class="pill" style="fill:#92400e">… Đang chờ</text>
  <text x="884" y="418" class="t">Đang mở · đã gửi lệnh Đóng</text>
  <rect x="884" y="436" width="80" height="30" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="924" y="456" text-anchor="middle" class="sub">Mở</text>
  <rect x="972" y="436" width="80" height="30" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1012" y="456" text-anchor="middle" class="btn">Đóng</text>
  <text x="1064" y="456" class="sm">chờ rèm báo lại</text>

  <!-- 3 Điều hòa -->
  <rect x="868" y="492" width="348" height="150" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <circle cx="892" cy="516" r="11" fill="#1d4ed8"/>
  <text x="892" y="521" text-anchor="middle" class="num" style="fill:#ffffff">3</text>
  <text x="912" y="522" class="name">Điều hòa</text>
  <rect x="1052" y="505" width="152" height="22" rx="11" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1062" y="521" class="pill" style="fill:#991b1b">! Không xác minh được</text>
  <text x="884" y="554" class="t">Xác minh gần nhất: 28°C</text>
  <text x="884" y="576" class="sub" style="fill:#991b1b">Lệnh 26°C chưa có phản hồi</text>
  <rect x="884" y="594" width="34" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="901" y="615" text-anchor="middle" class="name">−</text>
  <text x="948" y="616" text-anchor="middle" class="name">26°C</text>
  <rect x="978" y="594" width="34" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="995" y="615" text-anchor="middle" class="name">+</text>
  <rect x="1120" y="594" width="84" height="32" rx="8" fill="#1d4ed8"/>
  <text x="1162" y="615" text-anchor="middle" class="btnw">Thử lại</text>

  <!-- Chú giải -->
  <text x="868" y="670" class="sec">NHÃN TRẠNG THÁI</text>
  <text x="868" y="694" class="sm"><tspan font-weight="700" style="fill:#166534">✓ Đã xác minh</tspan>  thiết bị đã báo lại đúng lệnh</text>
  <text x="868" y="716" class="sm"><tspan font-weight="700" style="fill:#92400e">… Đang chờ</tspan>  đã gửi lệnh, chưa có phản hồi</text>
  <text x="868" y="738" class="sm"><tspan font-weight="700" style="fill:#991b1b">! Không xác minh được</tspan>  hết thời gian chờ</text>

  <text x="60" y="748" class="sm">Hình chỉ đổi khi thiết bị xác nhận. Rèm vẫn vẽ mở, điều hòa vẫn hiện 28°.</text>
  <text x="1256" y="788" text-anchor="end" class="sm">Wireframe · thiết kế mục tiêu, chưa triển khai · 2/4</text>
</svg>
